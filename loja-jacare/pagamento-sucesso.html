<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Aprovado | Jacare Utilidades</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, Arial, sans-serif;
            background: #f4faf6;
            color: #17361f;
        }

        .box {
            width: min(92vw, 520px);
            padding: 40px 28px;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .status {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #e5f7eb;
            color: #008037;
            font-size: 2rem;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 10px;
            color: #008037;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #4d5d52;
        }

        .code {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #eef8f1;
            color: #008037;
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 26px;
            border-radius: 12px;
            background: #008037;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="box">
        <div class="status">OK</div>
        <h1>Pagamento aprovado</h1>
        <p>Seu pedido foi confirmado e ja entrou no fluxo da loja. Em breve a equipe fara o proximo contato.</p>
        <div class="code" id="cod-pedido">Pedido confirmado</div>
        <a class="btn" id="btn-voltar-loja" href="/">Voltar para a loja</a>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pedido = params.get('pedido');
        if (pedido) {
            document.getElementById('cod-pedido').textContent = pedido;
            document.getElementById('btn-voltar-loja').href = `/?pedido_recente=${encodeURIComponent(pedido)}`;
        }
    </script>
</body>
</html>
